services:
  # Spring Boot Backend Web Service
  - type: web
    name: secret-santa-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8085
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@secretsanta.local
      - key: ADMIN_PASSWORD
        value: Admin@2025

  # React Frontend Static Site
  - type: static
    name: secret-santa-frontend
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    plan: free
    region: oregon
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: secret-santa-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
