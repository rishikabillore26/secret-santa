server.port=${SERVER_PORT:8085}

# MySQL Database Configuration (can be overridden via environment variables)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/secretsanta_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Root@2025}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# JWT Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Default Admin Credentials (created on startup if not present)
app.admin.email=${ADMIN_EMAIL:admin@secretsanta.local}
app.admin.password=${ADMIN_PASSWORD:Admin@2025}
app.admin.name=${ADMIN_NAME:Office Administrator}

# CORS configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5174,http://localhost:5173,http://localhost:5175,http://localhost:3000,http://127.0.0.1:5174,http://127.0.0.1:5173,http://127.0.0.1:5175,https://tacking-rockband-settle.ngrok-free.dev}
